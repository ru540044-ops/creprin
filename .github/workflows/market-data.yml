# 相場データ・ニュースを定期取得して market-data ブランチに保存する。
# アプリ（trade/index.html）は raw.githubusercontent.com 経由でこの JSON を読む。
# 履歴を増やさないよう、market-data ブランチは毎回 1 コミットで上書きする。
name: Market data

on:
  schedule:
    - cron: "7,37 * * * *"   # 30分ごと（混雑する毎時0分を避ける）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/market_data.py --out out/market.json
      - name: Publish to market-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -q -m "Update market data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" market-data
